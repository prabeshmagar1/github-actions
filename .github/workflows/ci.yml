name : Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
        - name : checkout code
          uses: actions/checkout@v6

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name : install dependencies
          run : |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: run tests
          run: |
            pytest --junitxml = test-results.xml
            

